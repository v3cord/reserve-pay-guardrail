name: CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Secret Scanning
        run: |
          echo "Scanning codebase for dangerous client-exposed secrets..."
          if grep -rn "NEXT_PUBLIC_ADMIN_API_KEY" app/ public/ 2>/dev/null; then
            echo "❌ Security Failure: Found NEXT_PUBLIC_ADMIN_API_KEY in client bundle!"
            exit 1
          fi
          if grep -rn "admin_api_key_default" app/dashboard/ 2>/dev/null; then
            echo "❌ Security Failure: Found hardcoded admin API key in dashboard!"
            exit 1
          fi
          echo "✅ Secret scan passed: Zero administrative credentials exposed in client."

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Financial System Invariant Tests
        run: npx vitest run
