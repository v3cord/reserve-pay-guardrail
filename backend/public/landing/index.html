<script id="pixel-tree-canvas-engine">
(function() {
  let treeInitialized = false;

  function initPixelTree() {
    if (document.querySelector('#pixel-tree-canvas')) {
      treeInitialized = true;
      return;
    }

    const hero = document.querySelector('.framer-1jtu4e7') || document.querySelector('[data-framer-name="Hero"]');
    if (!hero) return;

    // Find the best visual container in the Hero
    const container = document.querySelector('.framer-caebf1-container') ||
                      document.querySelector('.framer-c3c37i-container') ||
                      document.querySelector('.framer-z4ulyg') ||
                      document.querySelector('.framer-1l84jmv') ||
                      document.querySelector('.framer-yewq66') ||
                      document.querySelector('[data-framer-name="Frame 114"]') ||
                      hero;

    if (!container) return;

    container.style.position = 'relative';
    container.style.overflow = 'hidden';

    // Canvas
    const canvas = document.createElement('canvas');
    canvas.id = 'pixel-tree-canvas';
    canvas.style.position = 'absolute';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '1';
    container.insertBefore(canvas, container.firstChild);

    // Live Telemetry Badge
    if (!container.querySelector('.live-telemetry-badge')) {
      const badge = document.createElement('div');
      badge.className = 'live-telemetry-badge';
      badge.style.position = 'absolute';
      badge.style.bottom = '20px';
      badge.style.right = '20px';
      badge.style.background = 'rgba(0, 0, 0, 0.75)';
      badge.style.border = '1px solid rgba(255, 87, 26, 0.4)';
      badge.style.borderRadius = '20px';
      badge.style.padding = '6px 14px';
      badge.style.fontSize = '12px';
      badge.style.fontWeight = '600';
      badge.style.color = '#ff571a';
      badge.style.fontFamily = 'monospace';
      badge.style.zIndex = '10';
      badge.style.display = 'flex';
      badge.style.alignItems = 'center';
      badge.style.gap = '8px';
      badge.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#ff571a;display:inline-block;box-shadow:0 0 8px #ff571a;animation:pulse 1.5s infinite"></span><span id="latency-val">4.2ms</span> Atomic Reservation SYNC ACTIVE';
      container.appendChild(badge);

      setInterval(() => {
        const latEl = document.getElementById('latency-val');
        if (latEl) {
          const ms = (3.2 + Math.random() * 2.6).toFixed(1);
          latEl.innerText = ms + 'ms';
        }
      }, 1400);
    }

    const ctx = canvas.getContext('2d');
    let width, height;
    const pixelSize = 4.5;

    function resize() {
      const rect = container.getBoundingClientRect();
      width = canvas.width = rect.width || hero.getBoundingClientRect().width || 1200;
      height = canvas.height = rect.height || hero.getBoundingClientRect().height || 600;
    }
    resize();
    window.addEventListener('resize', resize);

    const treePixels = [];
    const colors = [
      '#ff3b00', '#ff571a', '#ff7733', '#ff9944', '#ffb703', '#fb8500', '#d90429', '#ffffff'
    ];

    function buildBranch(x, y, angle, length, depth) {
      if (depth <= 0) return;
      const steps = Math.floor(length / pixelSize);
      let curX = x;
      let curY = y;

      for (let i = 0; i < steps; i++) {
        curX += Math.cos(angle) * pixelSize;
        curY -= Math.sin(angle) * pixelSize;

        const px = Math.floor(curX / pixelSize) * pixelSize;
        const py = Math.floor(curY / pixelSize) * pixelSize;

        treePixels.push({
          x: px,
          y: py,
          baseColor: colors[Math.floor(Math.random() * colors.length)],
          brightness: Math.random(),
          speed: 0.03 + Math.random() * 0.04,
          phase: Math.random() * Math.PI * 2,
          depth: depth
        });

        if (Math.random() > 0.35) {
          treePixels.push({
            x: px + (Math.random() > 0.5 ? pixelSize : -pixelSize),
            y: py,
            baseColor: colors[Math.floor(Math.random() * colors.length)],
            brightness: Math.random() * 0.8,
            speed: 0.03 + Math.random() * 0.04,
            phase: Math.random() * Math.PI * 2,
            depth: depth
          });
        }
      }

      const subBranches = depth > 3 ? 3 : 2;
      for (let b = 0; b < subBranches; b++) {
        const spread = (Math.random() - 0.5) * 0.95;
        buildBranch(curX, curY, angle + spread, length * 0.73, depth - 1);
      }
    }

    function generateTree() {
      treePixels.length = 0;
      const startX = width * 0.68;
      const startY = height * 0.92;

      // Tree trunk base
      for (let y = startY; y > startY - 60; y -= pixelSize) {
        for (let x = startX - 12; x <= startX + 12; x += pixelSize) {
          treePixels.push({
            x: Math.floor(x / pixelSize) * pixelSize,
            y: Math.floor(y / pixelSize) * pixelSize,
            baseColor: colors[Math.floor(Math.random() * (colors.length - 2))],
            brightness: 0.6 + Math.random() * 0.4,
            speed: 0.03,
            phase: Math.random() * Math.PI * 2,
            depth: 5
          });
        }
      }

      // Main branches
      buildBranch(startX, startY - 60, Math.PI / 2, 85, 4);
      buildBranch(startX - 10, startY - 45, Math.PI * 0.65, 75, 4);
      buildBranch(startX + 10, startY - 45, Math.PI * 0.35, 75, 4);
      buildBranch(startX - 15, startY - 30, Math.PI * 0.8, 60, 3);
      buildBranch(startX + 15, startY - 30, Math.PI * 0.2, 60, 3);
      buildBranch(startX - 20, startY - 20, Math.PI * 0.9, 50, 3);
      buildBranch(startX + 20, startY - 20, Math.PI * 0.1, 50, 3);
    }

    generateTree();

    let mouseX = -1000, mouseY = -1000;
    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });
    container.addEventListener('mouseleave', () => {
      mouseX = -1000;
      mouseY = -1000;
    });

    let time = 0;
    function render() {
      time += 0.04;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < treePixels.length; i++) {
        const p = treePixels[i];
        const wave = Math.sin(time * 2.5 + p.phase + (p.y * 0.05));
        let alpha = 0.35 + 0.65 * ((wave + 1) / 2);

        const dist = Math.hypot(p.x - mouseX, p.y - mouseY);
        if (dist < 90) {
          alpha = Math.min(1, alpha + (1 - dist / 90) * 0.9);
        }

        ctx.fillStyle = p.baseColor;
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x, p.y, pixelSize - 0.5, pixelSize - 0.5);

        if (alpha > 0.88 && (p.baseColor === '#ffffff' || p.baseColor === '#ffb703')) {
          ctx.fillStyle = 'rgba(255, 87, 26, 0.5)';
          ctx.fillRect(p.x - pixelSize * 0.5, p.y - pixelSize * 0.5, pixelSize * 2, pixelSize * 2);
        }
      }

      ctx.globalAlpha = 1.0;
      requestAnimationFrame(render);
    }

    render();
    treeInitialized = true;
  }

  const observer = new MutationObserver(() => {
    if (!treeInitialized || !document.querySelector('#pixel-tree-canvas')) {
      initPixelTree();
    }
  });
  
  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  } else {
    document.addEventListener('DOMContentLoaded', () => {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }

  setInterval(() => {
    if (!treeInitialized || !document.querySelector('#pixel-tree-canvas')) {
      initPixelTree();
    }
  }, 400);

  initPixelTree();
})();
</script>

        } else if (el.classList.contains('framer-aojr4a') || el.getAttribute('data-framer-name') === 'Frame 71') {
          targetContainer = el;
          targetParagraph = el.querySelector('.framer-1xa27fo') || el.firstElementChild;
          break;
        } else if (el.tagName === 'P') {
          targetParagraph = el.closest('.framer-1xa27fo') || el;
          targetContainer = targetParagraph.parentElement || el.parentElement;
          break;
        }
      }
    }

    if (!targetContainer && !targetParagraph) {
      const hero = document.querySelector('.framer-1jtu4e7') || document.querySelector('[data-framer-name="Hero"]');
      if (hero) {
        targetContainer = hero.querySelector('.framer-aojr4a') || hero;
      }
    }

    if (!targetContainer) return;

    // Create wrapper
    const wrapper = document.createElement('div');
    wrapper.id = 'hero-launch-app-wrapper';
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'row';
    wrapper.style.alignItems = 'center';
    wrapper.style.marginTop = '24px';
    wrapper.style.position = 'relative';
    wrapper.style.zIndex = '20';

    const btn = document.createElement('a');
    btn.id = 'hero-launch-app-btn';
    btn.className = 'launch-guardrail-cta-btn';
    btn.href = TARGET_URL;
    btn.target = '_self';
    btn.setAttribute('data-framer-name', 'Launch Controller');
    btn.textContent = 'Launch Guardrail Controller';

    btn.addEventListener('click', launchApp);
    wrapper.appendChild(btn);

    // Insert immediately after the paragraph container
    if (targetParagraph && targetParagraph.nextSibling) {
      targetContainer.insertBefore(wrapper, targetParagraph.nextSibling);
    } else if (targetContainer) {
      targetContainer.appendChild(wrapper);
    }
  }

  const observer = new MutationObserver(() => {
    injectLaunchButton();
  });

  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  } else {
    document.addEventListener('DOMContentLoaded', () => {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }

  setInterval(() => {
    injectLaunchButton();
  }, 300);

  injectLaunchButton();
})();
</script>

<style id="smooth-scroll-reveal-styles">
  /* Smooth container & row reveal without DOM text node mutation */
  .smooth-card-reveal,
  .smooth-row-reveal,
  .smooth-header-reveal {
    opacity: 0 !important;
    transform: translateY(22px) !important;
    transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1) !important;
    will-change: opacity, transform !important;
  }

  .smooth-card-reveal.is-revealed,
  .smooth-row-reveal.is-revealed,
  .smooth-header-reveal.is-revealed {
    opacity: 1 !important;
    transform: translateY(0) !important;
  }

  /* Preserve table row pair height consistency and alignment */
  .framer-1dh0lia > div,
  .framer-13cow0d > div {
    box-sizing: border-box !important;
  }

  @media (prefers-reduced-motion: reduce) {
    .smooth-card-reveal,
    .smooth-row-reveal,
    .smooth-header-reveal {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
  }
</style>

<script id="smooth-scroll-reveal-engine">
(function() {
  function setupScrollRevealEngine() {
    // 0. Replace outdated template copy with distinct failure-mode copy
    (function replaceOutdatedCopy() {
      const headings = document.querySelectorAll('.framer-sa5664 h2');
      headings.forEach(h2 => {
        if (h2.textContent.includes('Recall degradation') || h2.textContent.includes('Uncontrolled AI Spending')) {
          h2.textContent = 'Why Uncontrolled Agent Commerce Fails At Scale';
        }
      });

      const paras = document.querySelectorAll('.framer-sa5664 p');
      paras.forEach(p => {
        if (p.textContent.includes('Embeddings hit') || p.textContent.includes('Unrestricted AI agents execute probabilistic')) {
          p.textContent = 'Sub-second race conditions cause double-charging when multiple agents order concurrently';
        } else if (p.textContent.includes('VectorDBs are stateless') || p.textContent.includes('Traditional APIs and payment gateways')) {
          p.textContent = 'Runaway loop bugs drain corporate wallets in seconds without real-time TTL session caps';
        } else if (p.textContent.includes('Current systems are stitched') || p.textContent.includes('Naive API keys lack sequence-locked')) {
          p.textContent = 'Black-box tool calls lack cryptographic verification, breaking compliance & auditability';
        }
      });

      const h3s = document.querySelectorAll('.framer-sa5664 h3');
      h3s.forEach(h3 => {
        if (h3.textContent.includes('Accuracy vs Context') || h3.textContent.includes('Financial Safety vs Concurrency')) {
          h3.textContent = 'Financial Security vs Concurrency Scale';
        } else if (h3.textContent.trim() === 'VectorDB') {
          h3.textContent = 'Unprotected Gateway';
        }
      });
    })();

    // 1. Process Section Headers
    const useCaseHeader = document.querySelector('.framer-11k7vjq');
    if (useCaseHeader && !useCaseHeader.classList.contains('smooth-header-reveal')) {
      useCaseHeader.classList.add('smooth-header-reveal');
      useCaseHeader.style.transitionDelay = '0s';
    }

    const guaranteeHeader = document.querySelector('.framer-18hj82w');
    if (guaranteeHeader && !guaranteeHeader.classList.contains('smooth-header-reveal')) {
      guaranteeHeader.classList.add('smooth-header-reveal');
      guaranteeHeader.style.transitionDelay = '0s';
    }

    // 2. Process Use Cases Grid Section Cards (Image 1)
    const useCaseContainer = document.querySelector('.framer-al9tq9');
    if (useCaseContainer) {
      const grid = useCaseContainer.querySelector('div');
      if (grid) {
        const cards = Array.from(grid.children);
        cards.forEach((card, index) => {
          if (!card.classList.contains('smooth-card-reveal')) {
            card.classList.add('smooth-card-reveal');
            card.style.transitionDelay = (index * 0.08) + 's';
          }
        });
      }
    }

    // 3. Process Comparison Table Section Rows (Image 2)
    const leftCol = document.querySelector('.framer-1dh0lia');
    const rightCol = document.querySelector('.framer-13cow0d');

    if (leftCol && rightCol) {
      const leftRows = Array.from(leftCol.children);
      const rightRows = Array.from(rightCol.children);
      const maxRows = Math.max(leftRows.length, rightRows.length);

      for (let i = 0; i < maxRows; i++) {
        const delay = (i * 0.1) + 's';

        if (leftRows[i] && !leftRows[i].classList.contains('smooth-row-reveal')) {
          leftRows[i].classList.add('smooth-row-reveal');
          leftRows[i].style.transitionDelay = delay;
        }

        if (rightRows[i] && !rightRows[i].classList.contains('smooth-row-reveal')) {
          rightRows[i].classList.add('smooth-row-reveal');
          rightRows[i].style.transitionDelay = delay;
        }
      }
    }

    // 4. Set up IntersectionObserver to trigger smooth reveals on scroll
    const observerOptions = {
      root: null,
      rootMargin: '0px 0px -40px 0px',
      threshold: 0.08
    };

    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-revealed');
          obs.unobserve(entry.target);
        }
      });
    }, observerOptions);

    const items = document.querySelectorAll('.smooth-card-reveal, .smooth-row-reveal, .smooth-header-reveal');
    items.forEach(item => {
      const rect = item.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) {
        item.classList.add('is-revealed');
      } else {
        observer.observe(item);
      }
    });
  }

  const mutationObs = new MutationObserver(() => {
    setupScrollRevealEngine();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      setupScrollRevealEngine();
      mutationObs.observe(document.body, { childList: true, subtree: true });
    });
  } else {
    setupScrollRevealEngine();
    if (document.body) {
      mutationObs.observe(document.body, { childList: true, subtree: true });
    }
  }

  setInterval(setupScrollRevealEngine, 400);
})();
</script>
